name: docker-publish

# Publishes the api image to GHCR.
#
# Tagging strategy:
#   - Push to `main`               → `dev`, `main`, `sha-<short>`
#   - Push tag `v0.1.0` (semver)   → `v0.1.0`, `v0.1`, `0`, `latest`
#                                    (the `latest` alias activates only
#                                     for non-prerelease tags)
#   - workflow_dispatch            → `dev`-only (manual rebuild)
#
# Until v0.1.0 ships, every consumer should pin
# `ghcr.io/secrets-bridge/api:dev` — it's the rolling tag pointing at
# the latest `main` build. Post-v0.1.0, consumers switch to either a
# pinned `vMAJOR.MINOR.PATCH` for reproducibility or `latest` for
# rolling stable.
#
# Multi-arch (linux/amd64 + linux/arm64). First-build cold-cache run on
# a GitHub-hosted runner takes ~15-25 min with QEMU; subsequent runs
# hit the GHA cache and finish in 1-3 min.

# Every image carries an SBOM and SLSA provenance and is signed with
# cosign, keyless, by digest (the signing identity is this workflow). A
# version tag must be strict semver and point at a commit on main, or
# nothing is published. After a tag's images are pushed, the release
# job creates the GitHub Release with the tag's CHANGELOG section
# (generated notes when there is none) and the image digest. All repos
# release under one shared version; see RELEASING.md in
# secrets-bridge/.github.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One publish per ref at a time, in push order. Without this, two merges
# a few seconds apart race and whichever run finishes last owns :dev and
# :main, which can be the older commit.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the OIDC token is the signing identity.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A tag build needs main's history to check the tag is on it.
          fetch-depth: ${{ github.ref_type == 'tag' && 0 || 1 }}

      - name: Check the version tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a semver tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-pre)"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Rolling `dev` on every push to main (the long-lived
            # pre-v0.1.0 tag, kept post-v0.1.0 as the bleeding-edge alias)
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            # `main` as a human-readable alias matching the source branch
            type=ref,event=branch
            # Git-SHA tag so a specific image is always pinnable
            type=sha,format=short,prefix=sha-
            # Semver tags from git tags (active post-v0.1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # `latest` ONLY on non-prerelease semver tags
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=secrets-bridge-api
            org.opencontainers.image.description=Secrets Bridge Control Plane API
            org.opencontainers.image.vendor=secrets-bridge
            org.opencontainers.image.source=https://github.com/secrets-bridge/api
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # SLSA provenance and an SPDX SBOM go into the image index as
          # attestations, and the signature below covers them too.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull the build cache from the previously-published image so
          # cold-cache QEMU emulation only pays the full cost once.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        # By digest, so the signature covers every tag on it; --recursive
        # also signs each platform manifest of the multi-arch index.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - name: Output published tags
        run: |
          echo "Published tags:"
          echo "${{ steps.meta.outputs.tags }}"

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          WORKFLOW: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/docker-publish.yml@${{ github.ref }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          # The tag's CHANGELOG section: from "## [X.Y.Z]" to the next
          # "## [" heading, without link reference lines.
          awk -v v="${TAG#v}" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > "$notes"
          args=(--title "$TAG" --verify-tag)
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::warning::CHANGELOG.md has no [${TAG#v}] section; using generated notes"
            : > "$notes"
            args+=(--generate-notes)
          fi
          {
            echo
            echo "### Image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Verify the signature:"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity ${WORKFLOW} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "SBOM and build provenance are attached to the image:"
            echo
            echo '```'
            echo "docker buildx imagetools inspect ${IMAGE}@${DIGEST} --format '{{ json .Provenance }}'"
            echo "docker buildx imagetools inspect ${IMAGE}@${DIGEST} --format '{{ json .SBOM }}'"
            echo '```'
          } >> "$notes"
          gh release create "$TAG" "${args[@]}" --notes-file "$notes"
